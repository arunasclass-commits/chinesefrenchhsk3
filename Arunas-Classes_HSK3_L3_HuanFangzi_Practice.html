<script>
const COPYRIGHT="© 2026 RRAruna Enterprises · ChineseFrench · Aruna's Classes. All Rights Reserved.";

/* ================= TTS ================= */
let zhVoices=[], femaleVoice=null, maleVoice=null;
function pickVoice(){
  const vs=window.speechSynthesis?speechSynthesis.getVoices():[];
  zhVoices=vs.filter(v=>/zh(-|_)?(CN|Hans)/i.test(v.lang)||/chinese|mandarin|普通话|中文/i.test(v.name));
  if(!zhVoices.length) zhVoices=vs.filter(v=>/zh/i.test(v.lang));
  const fem=/female|woman|xiaoxiao|xiaoyi|xiaomeng|meijia|tingting|sinji|huihui|yaoyao|婷婷|美佳|女/i;
  const male=/male|man|yunyang|yunxi|yunjian|kangkang|zhiwei|liang|男/i;
  femaleVoice = zhVoices.find(v=>fem.test(v.name)) || null;
  maleVoice   = zhVoices.find(v=>male.test(v.name)) || null;
  // if we couldn't name-detect, split whatever zh voices exist across the two roles
  if(!femaleVoice && zhVoices[0]) femaleVoice=zhVoices[0];
  if(!maleVoice) maleVoice = zhVoices.find(v=>v!==femaleVoice) || zhVoices[0] || null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
// generic single-voice speak (female default)
function speak(txt){utter(txt,'A');}
function utter(txt,role){
  if(!window.speechSynthesis)return null;
  const u=new SpeechSynthesisUtterance(txt); u.lang="zh-CN";
  const female = role==='A';
  const v = female?femaleVoice:maleVoice;
  if(v) u.voice=v;
  const twoDistinctVoices = femaleVoice && maleVoice && femaleVoice!==maleVoice;
  if(twoDistinctVoices){
    // real separate voices: keep a gentle nudge so the contrast is obvious
    u.pitch = female?1.15:0.85;
    u.rate  = female?0.86:0.8;
  } else {
    // only one (or no) Chinese voice: force a BIG, unmistakable pitch + rate gap
    u.pitch = female?1.6:0.55;
    u.rate  = female?0.9:0.78;
  }
  return u;
}
// let the teacher/student hear each voice on demand
function testVoice(role){ if(!window.speechSynthesis)return; speechSynthesis.cancel(); const u=utter(role==='A'?"你好，我是王一雪。":"你好，我是刘明。",role); if(u) speechSynthesis.speak(u); }
// play the whole dialogue, each line in its speaker's voice (A=王一雪 female, B=刘明 male)
function speakDialogue(){
  if(!window.speechSynthesis)return; speechSynthesis.cancel();
  DIALOGUE.forEach((d,i)=>{
    const role = (i%2===0)?'A':'B';   // A-lines even (王一雪), B-lines odd (刘明)
    const u=utter(d[1],role); if(u) speechSynthesis.speak(u);
  });
}
// speak one line by index (used by the per-line ▶ buttons)
function speakLine(i){ if(!window.speechSynthesis)return; speechSynthesis.cancel(); const role=(i%2===0)?'A':'B'; const u=utter(DIALOGUE[i][1],role); if(u) speechSynthesis.speak(u); }
function speakSeq(lines){ speakDialogue(); }
function ttsOK(){return !!window.speechSynthesis;}

/* ================= DIALOGUE (课文1) ================= */
const DIALOGUE=[
 ["王一雪","小雪的初中离家有点儿远，咱们换一个近点儿的房子吧。","Xiǎo Xuě de chūzhōng lí jiā yǒudiǎnr yuǎn, zánmen huàn yí ge jìn diǎnr de fángzi ba."],
 ["刘明","好啊，我上网看看。你觉得这个小区怎么样？","Hǎo a, wǒ shàngwǎng kànkan. Nǐ juéde zhège xiǎoqū zěnmeyàng?"],
 ["王一雪","环境挺好的，离地铁站还不远。","Huánjìng tǐng hǎo de, lí dìtiězhàn hái bù yuǎn."],
 ["刘明","房子里面也不错，空调和洗衣机都是新的。","Fángzi lǐmiàn yě búcuò, kōngtiáo hé xǐyījī dōu shì xīn de."],
 ["王一雪","是不错，但是我不喜欢住一层。","Shì búcuò, dànshì wǒ bù xǐhuan zhù yī céng."],
 ["刘明","这个一层带一个小花园，我觉得咱们可以去看看。","Zhège yī céng dài yí ge xiǎo huāyuán, wǒ juéde zánmen kěyǐ qù kànkan."],
];

/* ================= SECTIONS ================= */

const SECTIONS=[

  audio:true,
  qs:[
   {type:'mcq', q:"王一雪和刘明想做什么？", qpy:"Wáng Yīxuě hé Liú Míng xiǎng zuò shénme?",
    opts:[{zh:"换房子",py:"huàn fángzi"},{zh:"买空调",py:"mǎi kōngtiáo"},{zh:"去女儿的初中",py:"qù nǚ'ér de chūzhōng"}], ans:0,
    why:"They discuss 换一个近点儿的房子 — changing to a closer house."},

    opts:[{zh:"房子太远",py:"fángzi tài yuǎn"},{zh:"她不喜欢住一层",py:"tā bù xǐhuan zhù yī céng"},{zh:"她不喜欢这个小区",py:"tā bù xǐhuan zhège xiǎoqū"}], ans:1,
    why:"She says 但是我不喜欢住一层 — she doesn't like living on the ground floor."},
   {type:'tf', q:"这个小区离地铁站很远。", qpy:"Zhège xiǎoqū lí dìtiězhàn hěn yuǎn.", ans:false,
    why:"王一雪 says 离地铁站还不远 — it's NOT far from the subway."},
   {type:'tf', q:"房子里的空调和洗衣机都是新的。", qpy:"Fángzi lǐ de kōngtiáo hé xǐyījī dōu shì xīn de.", ans:true,
    why:"刘明 says 空调和洗衣机都是新的 — both are new."},

 {id:'read', tab:'📖 阅读 Reading', showDialogue:true,

  qs:[
   {type:'tf', q:"王一雪想换一个近一点儿的房子。", qpy:"Wáng Yīxuě xiǎng huàn yí ge jìn yìdiǎnr de fángzi.", ans:true,

    opts:[{zh:"一个小花园",py:"yí ge xiǎo huāyuán"},{zh:"一个大阳台",py:"yí ge dà yángtái"},{zh:"一个车库",py:"yí ge chēkù"}], ans:0,
    why:"这个一层带一个小花园 — it comes with a small garden."},
   {type:'mcq', q:"王一雪觉得小区的环境怎么样？", qpy:"Wáng Yīxuě juéde xiǎoqū de huánjìng zěnmeyàng?",
    opts:[{zh:"挺好的",py:"tǐng hǎo de"},{zh:"不太好",py:"bú tài hǎo"},{zh:"太远了",py:"tài yuǎn le"}], ans:0,

 {id:'vocab', tab:'🔤 词语 Vocabulary',

  qs:[

    opts:[{zh:"个",py:"gè"},{zh:"层",py:"céng"},{zh:"条",py:"tiáo"}], ans:0, why:"花园 takes 个: 一个小花园."},

 {id:'grammar', tab:'🔧 语法 Grammar',
  howto:"<b>How to do this:</b> Each question tests a grammar point from this lesson (挺…的, 有点儿 vs 一点儿, 咱们). Choose the correct answer. 1 point each. <b>4 points.</b>",
  qs:[
   {type:'mcq', q:"哪个句子对？ (挺…的)", qpy:"Nǎge jùzi duì? (tǐng…de)",
    opts:[{zh:"环境挺好的。",py:"Huánjìng tǐng hǎo de."},{zh:"环境挺好。",py:"Huánjìng tǐng hǎo."},{zh:"挺环境好的。",py:"Tǐng huánjìng hǎo de."}], ans:0,
    why:"Pattern: 挺 + adjective + 的 → 挺好的."},
   {type:'mcq', q:"小雪的初中离家 ___ 远。 (an existing problem)", qpy:"Xiǎo Xuě de chūzhōng lí jiā ___ yuǎn.",
    opts:[{zh:"有点儿",py:"yǒudiǎnr"},{zh:"一点儿",py:"yìdiǎnr"}], ans:0,

   {type:'mcq', q:"咱们换一个近 ___ 的房子吧。 (a bit closer)", qpy:"Zánmen huàn yí ge jìn ___ de fángzi ba.",
    opts:[{zh:"一点儿",py:"yìdiǎnr"},{zh:"有点儿",py:"yǒudiǎnr"}], ans:0,
    why:"adjective + 一点儿 = a bit more ~ : 近一点儿 = a bit closer."},
   {type:'mcq', q:"妈妈对孩子说：“___ 去看看新房子吧。” (includes the listener)", qpy:"Māma duì háizi shuō: “___ qù kànkan xīn fángzi ba.”",
    opts:[{zh:"咱们",py:"zánmen"},{zh:"他们",py:"tāmen"}], ans:0,
    why:"咱们 = we (including YOU, the listener). 我们 may or may not include the listener; 他们 = they."},

 {id:'write', tab:'✍️ 写作 Writing', writing:true,
  howto:"<b>How to do this:</b> Part A is scored — <b>type each sentence in pinyin WITHOUT tone marks</b> (e.g. <i>zanmen huan yi ge fangzi ba</i>). Spaces and capitals don't matter. Press Check; if your spelling is wrong, the correct spelling and characters are shown. Part B has two open writing tasks (not scored) with model answers.",
  // Part A — scored pinyin typing. key = toneless pinyin of the sentence.
  pinyinTasks:[
   {zh:"咱们换一个房子吧。", py:"Zánmen huàn yí ge fángzi ba.", key:"zanmen huan yi ge fangzi ba", en:"Let's change to another house."},
   {zh:"环境挺好的。", py:"Huánjìng tǐng hǎo de.", key:"huanjing ting hao de", en:"The environment is quite good."},
   {zh:"空调和洗衣机都是新的。", py:"Kōngtiáo hé xǐyījī dōu shì xīn de.", key:"kongtiao he xiyiji dou shi xin de", en:"The air conditioner and washing machine are both new."},
   {zh:"我不喜欢住一层。", py:"Wǒ bù xǐhuan zhù yì céng.", key:"wo bu xihuan zhu yi ceng", en:"I don't like living on the ground floor."},

  tasks:[
   {prompt:"用四个生词描述你的家或小区。", ppy:"Yòng sì ge shēngcí miáoshù nǐ de jiā huò xiǎoqū.", pen:"Describe your home or neighbourhood using at least FOUR new words.",
    model:"我家的小区环境挺好的，离地铁站不远。房子里有空调和洗衣机，都是新的。我们住在三层，还有一个小花园。",
    modelpy:"Wǒ jiā de xiǎoqū huánjìng tǐng hǎo de, lí dìtiězhàn bù yuǎn. Fángzi lǐ yǒu kōngtiáo hé xǐyījī, dōu shì xīn de. Wǒmen zhù zài sān céng, hái yǒu yí ge xiǎo huāyuán.",

    modelpy:"Hǎo a, nà zánmen zhōumò qù kànkan ba. Rúguǒ fángzi lǐmiàn yě búcuò, wǒmen jiù huàn zhège.",
    moden:"OK, then let's go this weekend. If the inside is nice too, we'll take this one."},

function mcqV(zh,py,correctEn,distractors){
  return {type:'mcq', q:zh, qpy:py, isVocab:true, correctEn,
    opts:[{en:correctEn},...distractors.map(d=>({en:d}))], ans:0,
    why:`${zh} (${py}) = ${correctEn}.`};
}

/* ================= scoring / state ================= */
const SCORABLE=SECTIONS.filter(s=>s.qs);
const PA_COUNT=(SECTIONS.find(s=>s.id==='write')&&SECTIONS.find(s=>s.id==='write').pinyinTasks||[]).length;
const MAXTOTAL=SCORABLE.reduce((n,s)=>n+s.qs.length,0)+PA_COUNT;
let answered={};   // key sec#q -> {correct:bool}
function skey(){const el=document.getElementById('studentName');const n=el?el.value.trim():'';return "aruna_l3_"+(n?n.toLowerCase().replace(/\s+/g,'_'):'guest');}
function loadA(){try{return JSON.parse(localStorage.getItem(skey()))||{};}catch(e){return {};}}
// One-time cleanup: remove any answers saved by earlier builds (e.g. automated testing) so students start clean.
(function purgeLegacy(){try{const KEY='aruna_l3_purged_v2';if(!localStorage.getItem(KEY)){Object.keys(localStorage).forEach(k=>{if(/^aruna_l3_/.test(k)&&k!=='aruna_l3_name')localStorage.removeItem(k);});localStorage.setItem(KEY,'1');}}catch(e){}})();
function saveA(){try{localStorage.setItem(skey(),JSON.stringify(answered));}catch(e){}}
function secScore(id){const s=SECTIONS.find(x=>x.id===id);if(!s.qs)return null;let c=0;s.qs.forEach((_,i)=>{if(answered[id+'#'+i]&&answered[id+'#'+i].correct)c++;});return {c,t:s.qs.length};}
function total(){let c=0;SCORABLE.forEach(s=>{s.qs.forEach((_,i)=>{if(answered[s.id+'#'+i]&&answered[s.id+'#'+i].correct)c++;});});c+=paScore().c;return c;}
function secAnsweredCount(id){const s=SECTIONS.find(x=>x.id===id);if(!s.qs)return 0;let n=0;s.qs.forEach((_,i)=>{if(answered[id+'#'+i])n++;});return n;}
function updateHeader(){document.getElementById('totalBadge').textContent=`总分 Total: ${total()} / ${MAXTOTAL}`;
  document.querySelectorAll('nav.tabs button').forEach(b=>{const id=b.dataset.id;const s=SECTIONS.find(x=>x.id===id);if(s&&s.qs){b.classList.toggle('done',secAnsweredCount(id)>=s.qs.length);}});}

/* ================= tabs ================= */
let cur=SECTIONS[0].id;
function initTabs(){document.getElementById('tabNav').innerHTML=SECTIONS.map(s=>`<button data-id="${s.id}" class="${s.id===cur?'active':''}" onclick="goTab('${s.id}')">${s.tab}</button>`).join('')+
  `<button data-id="__total" class="${cur==='__total'?'active':''}" onclick="goTab('__total')">🏆 总分 Score</button>`;}
function goTab(id){if(window.speechSynthesis)speechSynthesis.cancel();cur=id;initTabs();render();}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dialogueHtml(){return `<div class="dialogue">${DIALOGUE.map(d=>`<div class="dline"><div class="who">${d[0]}</div><div class="zh">${d[1]}</div><div class="py">${d[2]}</div></div>`).join('')}</div>`;}

function qHtml(secId,q,i){
  const key=secId+'#'+i; const a=answered[key];
  let head=`<div class="q"><div class="zh"><span class="qnum">${i+1}.</span> ${q.isVocab?`${q.q}`:esc(q.q)}</div><div class="py">${esc(q.qpy)}</div></div>`;
  let body='';
  if(q.type==='tf'){
    body=`<div class="tf-row">
      <button class="tf ${a&&a.pick===true?(q.ans===true?'correct':'wrong'):''}" ${a?'disabled':''} onclick="answer('${secId}',${i},'tf',true)">✓ 对 True</button>
      <button class="tf ${a&&a.pick===false?(q.ans===false?'correct':'wrong'):''}" ${a?'disabled':''} onclick="answer('${secId}',${i},'tf',false)">✗ 错 False</button></div>`;
  } else {
    body=`<div class="opts">${q.opts.map((o,j)=>{
      let cls=''; if(a){ if(j===q.ans)cls='correct'; else if(a.pick===j)cls='wrong'; }
      const inner=q.isVocab?`<div class="oz">${esc(o.en)}</div>`:`<div class="oz">${esc(o.zh)}</div><div class="op">${esc(o.py)}</div>`;
      return `<button class="opt ${cls}" ${a?'disabled':''} onclick="answer('${secId}',${i},'mcq',${j})">${inner}</button>`;}).join('')}</div>`;
  }
  const whyCls=a?(a.correct?'ok':'no'):''; const whyTxt=a?((a.correct?'✓ 对了！ ':'✗ ')+q.why):'';
  body+=`<div class="why ${whyCls}" id="why-${secId}-${i}">${whyTxt}</div>`;
  return head+body;
}

function answer(secId,i,type,pick){
  const key=secId+'#'+i; if(answered[key])return;
  const q=SECTIONS.find(s=>s.id===secId).qs[i];
  const correct = type==='tf' ? (pick===q.ans) : (pick===q.ans);
  answered[key]={pick,correct};saveA();
  render(); updateHeader();
  const sc=secScore(secId);
  if(sc && secAnsweredCount(secId)>=q && false){} // noop
}

function render(){
  const area=document.getElementById('mainArea');
  if(cur==='__total'){ renderTotal(area); return; }
  const s=SECTIONS.find(x=>x.id===cur);
  if(s.writing){ renderWriting(area,s); return; }
  const sc=secScore(cur);
  let html=`<div class="card"><div class="sec-score">Section: ${sc.c} / ${sc.t}</div><div class="sec-title">${s.tab}</div>`;
  html+=`<div class="howto">${s.howto}</div>`;
  if(s.audio){ html+=`<div class="warn ${ttsOK()?'':'show'}">No Chinese voice on this browser — try Chrome/Edge, or read the dialogue in the Reading tab.</div>`;
    html+=`<div style="text-align:center;margin-bottom:8px;"><button class="play-btn" onclick="speakDialogue()">▶ 播放对话 Play whole dialogue</button>
      <div style="font-size:.72rem;color:var(--gray);margin-top:6px;">👩 王一雪 = female voice · 👨 刘明 = male voice. Tap a line to replay it.</div>
      <div style="margin-top:6px;"><button class="play-line" onclick="testVoice('A')">🔊 Hear 👩 王一雪</button> <button class="play-line" onclick="testVoice('B')">🔊 Hear 👨 刘明</button></div></div>
      <div style="margin-bottom:12px;">${DIALOGUE.map((d,i)=>{const female=(i%2===0);return `<button class="play-line" onclick="speakLine(${i})" title="replay this line"><span class="who ${female?'':'m'}">${female?'👩':'👨'} ${d[0]}</span> ▶</button>`;}).join('')}</div>`; }
  if(s.showDialogue) html+=dialogueHtml();
  html+=s.qs.map((q,i)=>qHtml(cur,q,i)).join('');
  const doneAll=secAnsweredCount(cur)>=s.qs.length;
  html+=`<div class="sec-done ${doneAll?'show':''}">✅ Section complete — ${sc.c} / ${sc.t}. ${nextTabBtn()}</div>`;
  html+=`</div>`;
  area.innerHTML=html;
}
function nextTabBtn(){const idx=SECTIONS.findIndex(s=>s.id===cur);if(idx<SECTIONS.length-1)return `<button class="btn gold" onclick="goTab('${SECTIONS[idx+1].id}')">Next section →</button>`;return `<button class="btn gold" onclick="goTab('__total')">See total →</button>`;}

// strip tone marks + spaces + punctuation -> bare ascii letters, for pinyin comparison
function tonelessPinyin(str){
  if(!str) return "";
  let s=str.normalize('NFD').replace(/[\u0300-\u036f]/g,''); // remove combining tone accents
  s=s.replace(/ü/gi,'u').replace(/v/gi,'u');                  // v/ü -> u
  s=s.toLowerCase().replace(/[^a-z]/g,'');                    // keep letters only (drop spaces/punct/digits)
  return s;
}
function renderWriting(area,s){
  const pt=s.pinyinTasks||[];
  const paHtml = pt.length? `
    <div class="pa-title" style="font-weight:800;color:var(--red-dark);margin:6px 0;">Part A · 拼音输入 Type in pinyin (no tones) — scored</div>
    ${pt.map((tk,i)=>{
      const key='write#pa'+i; const a=answered[key];
      const cls=a?(a.correct?'ok':'no'):'';
      return `<div class="q"><div class="zh"><span class="qnum">A${i+1}.</span> ${esc(tk.en)}</div></div>
        <input class="pyin" id="pyin-${i}" ${a?'disabled':''} value="${a?esc(a.raw):''}" placeholder="type pinyin without tones, e.g. huanjing ting hao de" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div style="margin-top:6px;">${a?'':`<button class="btn" onclick="checkPinyin(${i})">Check</button>`}</div>
        <div class="why ${cls}" id="pawhy-${i}">${a?(a.correct?'✓ 对了！ Correct spelling. ':'✗ Not quite. ')+`Correct: <b>${esc(tk.zh)}</b> — <span style="font-style:italic;">${esc(tk.py)}</span> (<span style="letter-spacing:.02em;">${esc(tk.key)}</span>)`:''}</div>
        <hr style="border:none;border-top:1px dashed #e5d9bf;margin:14px 0;">`;
    }).join('')}
    <div class="pa-title" style="font-weight:800;color:var(--red-dark);margin:14px 0 6px;">Part B · 写一写 Open writing (not scored)</div>` : '';
  area.innerHTML=`<div class="card"><div class="sec-score">Part A: ${paScore().c} / ${paScore().t}</div><div class="sec-title">${s.tab}</div><div class="howto">${s.howto}</div>
    ${paHtml}
    ${s.tasks.map((tk,i)=>`
      <div class="q"><div class="zh"><span class="qnum">${i+1}.</span> ${esc(tk.prompt)}</div><div class="py">${esc(tk.ppy)}</div>
        <div style="font-size:.85rem;color:var(--ink);margin:4px 0 8px;">${esc(tk.pen)}</div></div>
      <textarea placeholder="Write in Chinese here..."></textarea>
      <div style="margin-top:8px;"><button class="btn outline" onclick="document.getElementById('model-${i}').classList.toggle('show')">Show a model answer</button></div>
      <div class="model" id="model-${i}"><div class="zh">${esc(tk.model)}</div><div class="py">${esc(tk.modelpy)}</div><div style="font-size:.85rem;margin-top:4px;">${esc(tk.moden)}</div></div>
    `).join('<hr style="border:none;border-top:1px dashed #e5d9bf;margin:16px 0;">')}
    <div style="text-align:center;margin-top:14px;">${nextTabBtn()}</div></div>`;
}

function paTasks(){const s=SECTIONS.find(x=>x.id==='write');return (s&&s.pinyinTasks)||[];}
function paScore(){let c=0;const t=paTasks().length;paTasks().forEach((_,i)=>{const a=answered['write#pa'+i];if(a&&a.correct)c++;});return {c,t};}
function checkPinyin(i){
  const key='write#pa'+i; if(answered[key])return;
  const tk=paTasks()[i];
  const raw=(document.getElementById('pyin-'+i)||{}).value||'';
  const correct = tonelessPinyin(raw)===tonelessPinyin(tk.key);
  answered[key]={raw,correct};saveA();
  render(); updateHeader();
}
function renderTotal(area){
  const t=total(); const pct=Math.round(t/MAXTOTAL*100);
  let rows=SCORABLE.map(s=>{const sc=secScore(s.id);return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e5d9bf;"><span>${s.tab}</span><b style="color:${sc.c===sc.t?'var(--green)':'var(--red-dark)'}">${sc.c} / ${sc.t}</b></div>`;}).join('');
  {const pa=paScore();rows+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #e5d9bf;"><span>✍️ 写作 Writing (Part A)</span><b style="color:${pa.c===pa.t?'var(--green)':'var(--red-dark)'}">${pa.c} / ${pa.t}</b></div>`;}
  area.innerHTML=`<div class="total-card">
    <div class="sec-title" style="text-align:center;">🏆 总分 Total Score</div>
    <div class="total-num">${t} / ${MAXTOTAL}</div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div style="font-weight:800;color:${pct>=80?'var(--green)':pct>=50?'var(--gold)':'var(--red)'};margin-bottom:14px;">${pct}%</div>
    <div style="text-align:left;max-width:420px;margin:0 auto;">${rows}</div>
    <div style="margin-top:16px;">
      <button class="btn outline" onclick="resetAll()">↺ Reset all answers</button>
      <button class="btn" onclick="goTab('${SECTIONS[0].id}')">Back to start</button>
    </div></div>`;
}
function resetAll(){if(!confirm("Clear all your answers and scores?"))return;answered={};saveA();updateHeader();initTabs();goTab(SECTIONS[0].id);}

/* ================= init ================= */
document.addEventListener('DOMContentLoaded',()=>{
  let saved=null;try{saved=localStorage.getItem('aruna_l3_name');}catch(e){}
  if(saved)document.getElementById('studentName').value=saved;
  document.getElementById('studentName').addEventListener('change',()=>{try{localStorage.setItem('aruna_l3_name',document.getElementById('studentName').value.trim());}catch(e){}answered=loadA();updateHeader();initTabs();render();});
  answered=loadA();
  initTabs(); render(); updateHeader();
  console.log(COPYRIGHT);
});
</script>
